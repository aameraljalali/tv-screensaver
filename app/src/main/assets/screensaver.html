<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة التوقف</title>
<style>
  :root{--ink:#0c1822;--teal:#16363f;--sand:#ece3cf;--sand-dim:rgba(236,227,207,.55);--sand-faint:rgba(236,227,207,.14);--gold:#dbb96c;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--sand);overflow:hidden;font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
  .glow{position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(55% 50% at 28% 32%, rgba(36,96,108,.55), transparent 70%),radial-gradient(45% 40% at 78% 72%, rgba(219,185,108,.10), transparent 70%);animation:breathe 45s ease-in-out infinite alternate}
  @keyframes breathe{to{transform:translate(4%,3%) scale(1.08)}}
  .stage{position:relative;height:100%;padding:6vh 5vw;display:grid;grid-template-rows:auto 1fr auto;transition:transform 3s ease}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .clock{font-size:clamp(44px,6.2vw,130px);font-weight:200;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
  .clock small{font-size:.28em;font-weight:300;color:var(--sand-dim);margin-inline-start:.5em}
  .dates{margin-top:1.4vh;font-size:clamp(13px,1.35vw,28px);font-weight:300;color:var(--sand-dim)}
  .dates span+span::before{content:"";display:inline-block;width:1px;height:.9em;background:var(--sand-faint);margin:0 .9em;vertical-align:-.1em}
  .weather{text-align:end;font-weight:300}
  .temp{font-size:clamp(26px,3vw,64px);font-weight:200;line-height:1}
  .cond{margin-top:1vh;font-size:clamp(12px,1.2vw,26px);color:var(--sand-dim)}
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8vw;gap:3.2vh}
  .brand{font-size:clamp(54px,9vw,200px);font-weight:200;line-height:1.15;letter-spacing:.01em;color:var(--sand);text-align:center}
  .rule{width:clamp(48px,6vw,120px);height:1px;background:var(--gold);opacity:.7}
  .dhikr{max-width:62ch;text-align:center;line-height:1.9;min-height:3.8em;font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic","Scheherazade New",serif;font-size:clamp(16px,2vw,42px);color:var(--sand-dim);opacity:0;transition:opacity 2.5s ease}
  .dhikr.on{opacity:.92}
  .prayers{display:flex;justify-content:space-between;align-items:flex-end;gap:2vw;border-top:1px solid var(--sand-faint);padding-top:2.4vh}
  .p{display:flex;flex-direction:column;gap:.5vh;font-weight:300}
  .p .n{font-size:clamp(12px,1.2vw,26px);color:var(--sand-dim)}
  .p .t{font-size:clamp(16px,1.9vw,40px);font-weight:300;font-variant-numeric:tabular-nums}
  .p.next .n,.p.next .t{color:var(--gold)}
  .count{font-size:clamp(12px,1.2vw,26px);color:var(--gold);font-weight:300;text-align:end;white-space:nowrap}
  .count b{font-weight:300;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){.glow{animation:none}.dhikr,.stage{transition:none}}
</style>
</head>
<body>
<div class="glow"></div>
<main class="stage" id="stage">
  <section class="top">
    <div>
      <div class="clock" id="clock">--:--<small id="ap"></small></div>
      <div class="dates"><span id="greg"></span><span id="hijri"></span></div>
    </div>
    <div class="weather">
      <div class="temp" id="temp">--°</div>
      <div class="cond" id="cond">مكة المكرمة</div>
    </div>
  </section>
  <section class="mid">
    <h1 class="brand">عامر الجلالي</h1>
    <div class="rule"></div>
    <p class="dhikr" id="dhikr"></p>
  </section>
  <section class="prayers" id="prayers"></section>
</main>
<script>
(() => {
  const TZ = 'Asia/Riyadh';
  const LAT = 21.3891, LON = 39.8579;
  const nf = new Intl.NumberFormat('ar-EG', {useGrouping:false});
  const nf2 = new Intl.NumberFormat('ar-EG', {useGrouping:false, minimumIntegerDigits:2});
  const PRAYERS = [['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
  const ADHKAR = [
    'سبحان الله وبحمده، سبحان الله العظيم',
    'لا حول ولا قوة إلا بالله',
    'أستغفر الله وأتوب إليه',
    'اللهم صلِّ وسلِّم على نبينا محمد',
    'لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير',
    'سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر',
    'حسبي الله لا إله إلا هو، عليه توكلت وهو رب العرش العظيم',
    'رب اغفر لي وتب عليّ إنك أنت التواب الرحيم'
  ];
  const WEATHER = c => c===0?'صافٍ':c<=2?'غائم جزئيًا':c===3?'غائم':c<=48?'ضباب':c<=57?'رذاذ':c<=67?'مطر':c<=77?'ثلج':c<=82?'زخات مطر':c<=99?'عاصفة رعدية':'';
  const fmt = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'});
  function now() {
    const o = {}; fmt.formatToParts(new Date()).forEach(p => o[p.type] = p.value);
    return {y:+o.year, mo:+o.month, d:+o.day, h:+o.hour, mi:+o.minute, s:+o.second, secs:(+o.hour)*3600 + (+o.minute)*60 + (+o.second)};
  }
  const ddmmyyyy = (y,mo,d) => `${String(d).padStart(2,'0')}-${String(mo).padStart(2,'0')}-${y}`;
  const toSecs = t => { const [h,m] = t.slice(0,5).split(':').map(Number); return h*3600 + m*60; };
  let today = null, tomorrowFajr = null, loadedDay = null, hijriText = '';
  async function loadPrayers() {
    const n = now(); const t2 = new Date(Date.UTC(n.y, n.mo-1, n.d+1));
    const url = (dstr) => `https://api.aladhan.com/v1/timingsByCity/${dstr}?city=Makkah&country=SA&method=4`;
    try {
      const [a, b] = await Promise.all([fetch(url(ddmmyyyy(n.y,n.mo,n.d))).then(r => r.json()), fetch(url(ddmmyyyy(t2.getUTCFullYear(), t2.getUTCMonth()+1, t2.getUTCDate()))).then(r => r.json())]);
      today = a.data.timings; tomorrowFajr = b.data.timings.Fajr;
      const h = a.data.date.hijri; hijriText = `${nf.format(h.day)} ${h.month.ar} ${nf.format(h.year)} هـ`;
      loadedDay = n.d; document.getElementById('hijri').textContent = hijriText;
    } catch (e) { setTimeout(loadPrayers, 5 * 60 * 1000); }
  }
  async function loadWeather() {
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=Asia%2FRiyadh`).then(x => x.json());
      document.getElementById('temp').textContent = nf.format(Math.round(r.current.temperature_2m)) + '°';
      document.getElementById('cond').textContent = 'مكة المكرمة · ' + WEATHER(r.current.weather_code);
    } catch (e) {}
  }
  const prayersEl = document.getElementById('prayers');
  prayersEl.innerHTML = PRAYERS.map(([k,ar]) => `<div class="p" data-k="${k}"><span class="n">${ar}</span><span class="t">--:--</span></div>`).join('') + `<div class="count" id="count"></div>`;
  const greg = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab', {timeZone:TZ, weekday:'long', day:'numeric', month:'long'});
  function tick() {
    const n = now(); const h12 = n.h % 12 || 12;
    document.getElementById('clock').firstChild.textContent = `${nf.format(h12)}:${nf2.format(n.mi)}`;
    document.getElementById('ap').textContent = n.h >= 12 ? 'م' : 'ص';
    document.getElementById('greg').textContent = greg.format(new Date());
    if (loadedDay !== null && loadedDay !== n.d) { loadedDay = null; loadPrayers(); }
    if (!today) return;
    let next = null;
    PRAYERS.forEach(([k]) => {
      const el = prayersEl.querySelector(`[data-k="${k}"]`); const secs = toSecs(today[k]); const hh = +today[k].slice(0,2) % 12 || 12;
      el.querySelector('.t').textContent = `${nf.format(hh)}:${today[k].slice(3,5).replace(/\d/g, d => nf.format(+d))}`;
      el.classList.remove('next'); if (!next && secs > n.secs) next = {k, secs};
    });
    let remain, label;
    if (next) { prayersEl.querySelector(`[data-k="${next.k}"]`).classList.add('next'); remain = next.secs - n.secs; label = PRAYERS.find(p => p[0] === next.k)[1]; }
    else if (tomorrowFajr) { remain = 86400 - n.secs + toSecs(tomorrowFajr); label = 'الفجر'; }
    if (remain != null) { const H = Math.floor(remain/3600), M = Math.floor(remain%3600/60), S = remain%60; document.getElementById('count').innerHTML = `${label} بعد <b>${nf.format(H)}:${nf2.format(M)}:${nf2.format(S)}</b>`; }
  }
  const dEl = document.getElementById('dhikr'); let di = Math.floor(Math.random() * ADHKAR.length);
  function showDhikr() { dEl.classList.remove('on'); setTimeout(() => { dEl.textContent = ADHKAR[di]; di = (di + 1) % ADHKAR.length; dEl.classList.add('on'); }, 2600); }
  const stage = document.getElementById('stage');
  function drift() { const dx = Math.round((Math.random() - .5) * 28), dy = Math.round((Math.random() - .5) * 20); stage.style.transform = `translate(${dx}px, ${dy}px)`; }
  loadPrayers(); loadWeather(); tick(); setInterval(tick, 1000); showDhikr(); setInterval(showDhikr, 30000); setInterval(loadWeather, 20 * 60 * 1000); setInterval(drift, 3 * 60 * 1000);
})();
</script>
</body>
</html>
